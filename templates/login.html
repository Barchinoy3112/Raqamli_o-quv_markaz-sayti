{% extends 'base.html' %}

{% block title %}Tizimga kirish - Raqamli O'quv Markaz{% endblock %}

{% block content %}
    <div class="container page-section">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card p-4 shadow-sm">
                    <div class="mb-4 text-center">
                        <h3 class="fw-bold mb-2">Tizimga kirish</h3>
                        <p class="text-muted mb-0">Email va parolingiz bilan tizimga kiring.</p>
                    </div>

                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Parol</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg">Kirish</button>
                        </div>
                    </form>

                    <hr>
                    <p class="text-center mb-0 text-muted">
                        Hisob yo'qmi? <a href="{% url 'register' %}">Ro'yxatdan o'tish</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
